[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cookbook"
version = "0.1.0"
description = "Local-first recipe repository: turn shared video reels into a searchable, cookbook-formatted recipe library."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "See LICENSE" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Heavier / networked pipeline stages. Not required to run the deterministic core.
media = [
    "yt-dlp>=2024.4.9",
]
transcription = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
cookbook = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
