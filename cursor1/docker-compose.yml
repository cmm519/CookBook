# CookBook stack — paths come from .env (generated by CookBook-Setup.bat)
services:
  cookbook:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      MODE: ${MODE:-web}
    ports:
      - "${WEB_PORT:-8080}:8080"
      - "${TESTING_GUI_PORT:-8081}:8081"
      - "${DEPLOYMENT_GUI_PORT:-8082}:8082"
    volumes:
      - ${HOST_RECIPES_DIR:-./recipes}:/data/recipes
      - ${HOST_WORKING_DIR:-./working}:/data/working
      - ${HOST_DATASET_DIR:-./dataset}:/data/dataset
      - ${HOST_DB_DIR:-./data/db}:/data/db
      - ${HOST_WHISPER_CACHE_DIR:-./data/whisper-cache}:/root/.cache
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/scripts/ollama-bootstrap.sh"]
    volumes:
      - ${HOST_OLLAMA_DIR:-./data/ollama}:/root/.ollama
      - ${HOST_FORMATTER_MODEL_DIR:-..}:/models:ro
      - ./scripts/ollama-bootstrap.sh:/scripts/ollama-bootstrap.sh:ro
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      FORMATTER_MODEL: ${FORMATTER_MODEL:-cookbook-formatter}
      FORMATTER_GGUF_PATH: ${FORMATTER_GGUF_PATH:-/models/cookbook-formatter.gguf}
      FORMATTER_MODELFILE: ${FORMATTER_MODELFILE:-/models/Modelfile}
    restart: unless-stopped
