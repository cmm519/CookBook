[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cookbook"
version = "0.1.0"
description = "Local-first recipe repository from Instagram Reels"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pytest>=8.0",
    "yt-dlp>=2024.1",
    "faster-whisper>=1.0",
    # faster-whisper calls av.open(..., metadata_errors=...); av>=19 dropped that
    # kwarg and breaks every transcription. Pin below the break until
    # faster-whisper is updated for the newer PyAV API.
    "av>=12,<19",
    # CUDA runtime libs for ctranslate2 (faster-whisper) GPU inference — the
    # python:3.12-slim base image ships none of its own.
    "nvidia-cublas-cu12>=12,<13",
    "nvidia-cudnn-cu12>=9,<10",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pytesseract>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cookbook = "app.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
